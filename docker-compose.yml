version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mathmodern
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_secure}
      POSTGRES_DB: mathmodern
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mathmodern"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8081:3000"
    environment:
      DATABASE_URL: postgresql://mathmodern:${DB_PASSWORD:-changeme_secure}@db:5432/mathmodern
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:8081}
      NEXT_PUBLIC_APP_URL: ${NEXTAUTH_URL:-http://localhost:8081}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./prisma:/app/prisma

volumes:
  postgres_data:
